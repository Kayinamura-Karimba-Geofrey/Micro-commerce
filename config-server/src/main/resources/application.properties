server.port=8888
spring.application.name=config-server

# Serve configuration from a local directory (native profile) instead of a git
# repository, so the repo works without an external git server.
# In Docker the config-repo directory is mounted at /app/config-repo.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO_LOCATION:file://${user.dir}/config-repo}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
