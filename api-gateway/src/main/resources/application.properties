server.port=8080
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Spring Cloud Gateway Routes
# The discovery locator must stay disabled: it would auto-create /{service-id}/**
# routes that bypass the AuthenticationFilter (auth bypass vulnerability).
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# CORS for browser clients (comma-separated origins; override via env var).
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# Actuator runs on a separate port that is not published by docker compose,
# so metrics are not reachable through the public gateway port.
management.server.port=${MANAGEMENT_PORT:8090}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

# Must match the secret used by user-service. No default on purpose: set the
# JWT_SECRET env var (base64, at least 256 bits), e.g. `openssl rand -base64 48`.
jwt.secret=${JWT_SECRET}

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

# Anyone authenticated can read products; creating/deleting requires ADMIN.
spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/products/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=AuthenticationFilter=ADMIN

spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/orders/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=AuthenticationFilter

spring.cloud.gateway.server.webflux.routes[3].id=payment-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/payments/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=AuthenticationFilter
