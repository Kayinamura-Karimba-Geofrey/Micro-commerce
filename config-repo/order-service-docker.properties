# Central configuration for the "docker" profile, served by config-server.
# Values are overridden by environment variables set in docker-compose.yml.
spring.datasource.url=jdbc:postgresql://postgres:5432/order_db
spring.kafka.bootstrap-servers=kafka:29092
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
